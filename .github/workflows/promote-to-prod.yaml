name: Promote SDKs

# Merge-commit PR variant of stlc's examples/sdk-repo-pr stlc-promote.yml, for
# when the production repo requires a PR for changes to main. On push to
# staging main (and manual dispatch) it pushes staging main to the stlc/release
# branch on production and opens (or refreshes) a PR into production main.
# A person reviews and merges that PR. It MUST merge with a MERGE COMMIT —
# never squash/rebase, or the SHAs get rewritten and the trunks fork. Merging
# it triggers release-please on production, whose own release PR is the
# publish gate. Self-routed to staging; needs DATAGRID_PROD_REPO_TOKEN with
# Contents + Pull requests: write on production.
on:
  push:
    # main only. stlc preview/integrated/codegen branches never push to main.
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  promote:
    # Runner comes from the STLC_RUNNER repo/org variable when set; defaults to GitHub-hosted.
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    if: github.repository == 'ToricLabs/datagrid-python-staging'
    concurrency:
      group: stlc-promote
      cancel-in-progress: true
    env:
      PRODUCTION_REPO: DatagridAI/datagrid-python
      GH_TOKEN: ${{ secrets.DATAGRID_PROD_REPO_TOKEN }}
    steps:
      - name: Check out staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch production main
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production already has staging's content
        id: diff
        run: |
          # Compare by CONTENT, not SHA: release-please commits on production
          # make the SHAs always differ, which would re-open a spurious PR.
          MERGED=$(git merge-tree --write-tree production/main origin/main) || MERGED=conflict
          PRODUCTION_TREE=$(git rev-parse 'production/main^{tree}')
          if [ "$MERGED" = "$PRODUCTION_TREE" ]; then
            echo "Production already contains staging's content. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push staging main to the release branch on production
        if: steps.diff.outputs.synced == 'false'
        run: |
          # Force is safe: this branch only carries the PR; re-pushing updates it in place.
          git push production origin/main:refs/heads/stlc/release --force

      - name: Open or update the promote PR (merge commit)
        if: steps.diff.outputs.synced == 'false'
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "${PRODUCTION_REPO}" \
            --head stlc/release \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "${EXISTING_PR}" ]; then
            gh pr create \
              --repo "${PRODUCTION_REPO}" \
              --base main \
              --head stlc/release \
              --title "Release SDK updates" \
              --body "$(printf '%s\n\n%s\n' \
                '**Merge with a merge commit** (never squash or rebase): staging and production must share these commits, or the next back-sync and stlc build break.' \
                "$(git log --oneline production/main..origin/main)")"
          else
            echo "Promote PR #${EXISTING_PR} already exists. The force-push has updated it."
          fi
          # No auto-merge: a person reviews and merges the promote PR.

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.STLC_ALERT_WEBHOOK_URL }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="stlc promote failed in ${{ github.repository }}. A stalled promote or back-sync lets custom-code tracking drift, which later builds refuse on — investigate before the next build. Run: $run_url"
          echo "::error title=stlc workflow failed::$msg"
          { echo "### ⚠️ stlc workflow failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg text "$msg" '{text:$text}')" "$ALERT_WEBHOOK_URL" \
              || echo "::warning::Alert webhook POST failed"
          fi
